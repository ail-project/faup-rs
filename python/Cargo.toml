[package]
name = "pyfaup-rs"
version = "0.4.25"
edition = "2021"
rust-version = "1.85.1"
description = "Python bindings for faup-rs"
readme = "README.md"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
name = "pyfaup"

[dependencies]
faup-rs = { path = "../faup" }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
